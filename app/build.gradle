plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-android-extensions'
}

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "com.personal.accountantAssistant"
        minSdkVersion 26
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        dataBinding true
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    def lifeCycleVersion = "2.3.1"
    def navigationVersion = "2.3.5"
    def googleHttpApiVersion = "1.26.0"
    def koin_version = "2.2.3"

    //---Kotlin dependencies-----------------------------------------------
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    //----------Core dependencies----------------------
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation 'android.arch.persistence.room:rxjava2:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.3.6'

    //Koin for dependency injection
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-android-viewmodel:$koin_version"

    //----------LifeCycle dependencies----------------------
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifeCycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifeCycleVersion"

    //----Navigation------------------------------------------------
    implementation "androidx.navigation:navigation-fragment-ktx:$navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navigationVersion"

    //----------Recycler view dependencies----------------------
    implementation "androidx.recyclerview:recyclerview:1.2.1"

    //-------------Google dependencies-------------------------
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-auth:19.2.0'
    implementation "com.google.http-client:google-http-client-gson:$googleHttpApiVersion"
    implementation("com.google.api-client:google-api-client-android:$googleHttpApiVersion") {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev136-1.25.0') {
        exclude group: 'org.apache.httpcomponents'
    }

    //------------Retrofit dependencies---------------
    implementation 'com.squareup.okhttp3:okhttp:4.8.0'

    //-----Spark dependencies---------------
    implementation "com.sparkjava:spark-core:2.9.2"

    //-----Stripe dependencies---------------
    implementation "com.stripe:stripe-java:19.45.0"
    implementation 'com.stripe:stripe-android:15.1.0'

    //-----Other dependencies---------------
    implementation 'org.apache.poi:poi:3.9'
    implementation 'jexcelapi:jxl:2.4.2'
    implementation 'javax.mail:javax.mail-api:1.6.0'

    //-----Test dependencies---------------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}