plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.personal.accountantAssistant"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {

        Properties prop = new Properties()
        prop.load(project.rootProject.file(LOCAL_PROPERTIES).newDataInputStream())

        def ADMOB_TEST_DEVICE_ID_VALUE = "\"${prop.getProperty(ADMOB_TEST_DEVICE_ID)}\""
        def ADMOB_UNIT_ID_VALUE = "\"${prop.getProperty(ADMOB_UNIT_ID)}\""
        def ADMOB_DEBUG_TEST_DEVICE_ID_VALUE = "\"${prop.getProperty(ADMOB_DEBUG_TEST_DEVICE_ID)}\""
        def ADMOB_DEBUG_UNIT_ID_VALUE = "\"${prop.getProperty(ADMOB_DEBUG_UNIT_ID)}\""

        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField STRING, ADMOB_TEST_DEVICE_ID, ADMOB_TEST_DEVICE_ID_VALUE
            buildConfigField STRING, ADMOB_UNIT_ID, ADMOB_UNIT_ID_VALUE
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField STRING, ADMOB_TEST_DEVICE_ID, ADMOB_DEBUG_TEST_DEVICE_ID_VALUE
            buildConfigField STRING, ADMOB_UNIT_ID, ADMOB_DEBUG_UNIT_ID_VALUE
        }
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    //---Kotlin dependencies-----------------------------------------------
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.1'

    //----------Core dependencies----------------------
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation "androidx.appcompat:appcompat:1.5.1"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.5.3'

    //Koin for dependency injection
    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-android-viewmodel:$koin_version"

    //----------LifeCycle dependencies----------------------
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifeCycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifeCycleVersion"

    //----Navigation------------------------------------------------
    implementation "androidx.navigation:navigation-fragment-ktx:$navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navigationVersion"

    //----Room------------------------------------------------
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    //----------Recycler view dependencies----------------------
    implementation "androidx.recyclerview:recyclerview:1.2.1"

    //-------------Google dependencies-------------------------
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'com.google.android.gms:play-services-ads:21.2.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-auth:20.3.0'
    implementation "com.google.http-client:google-http-client-gson:1.39.2"
    implementation("com.google.api-client:google-api-client-android:$googleHttpApiVersion") {
        exclude group: 'org.apache.httcomponents'
        exclude module: 'guava-jdk5'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev136-1.25.0') {
        exclude group: 'org.apache.httcomponents'
        exclude module: 'guava-jdk5'
    }

    //-------------Firebase dependencies-------------------------
    implementation platform('com.google.firebase:firebase-bom:29.3.1')
    implementation 'com.google.firebase:firebase-perf-ktx:20.1.1'
    implementation 'com.google.firebase:firebase-analytics-ktx:21.1.1'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.2.13'
    implementation 'com.google.firebase:firebase-config-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-messaging-directboot:23.0.8'

    //------------Retrofit dependencies---------------
    implementation 'com.squareup.okhttp3:okhttp:4.8.0'

    //------------Glide dependencies---------------
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    annotationProcessor "com.github.bumptech.glide:compiler:$glideVersion"

    //-----Spark dependencies---------------
    implementation "com.sparkjava:spark-core:2.9.2"

    //-----Stripe dependencies---------------
    implementation "com.stripe:stripe-java:19.45.0"
    implementation 'com.stripe:stripe-android:15.1.0'

    //-----Other dependencies---------------
    implementation 'org.apache.poi:poi:3.9'
    implementation 'jexcelapi:jxl:2.4.2'
    implementation 'javax.mail:javax.mail-api:1.6.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //-----Test dependencies---------------
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}