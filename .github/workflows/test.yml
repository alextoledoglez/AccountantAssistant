name: Android Tests
on: [ push ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "prop1=${{ secrets.ADMOB_UNIT_ID }}" > local.properties
          echo "prop2=${{ secrets.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "prop3=${{ secrets.ADMOB_DEBUG_UNIT_ID }}" >> local.properties
          echo "prop4=${{ secrets.ADMOB_DEBUG_TEST_DEVICE_ID }}" >> local.properties
          echo "prop5=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "prop6=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "prop7=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "prop8=${{ env.STORE_FILE_NAME }}" >> local.properties

      - name: Unit Test
        run: ./gradlew testDebugUnitTest

      - name: Android Test Report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }}