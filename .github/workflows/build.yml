name: Android Build

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "dev", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Include env.yml
        uses: actions/uses@v3
        with:
          ref: env.yml

      - name: Create local.properties
        run: |
          echo "prop1=${{ env.ADMOB_UNIT_ID }}" > local.properties
          echo "prop2=${{ env.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "prop3=${{ env.ADMOB_DEBUG_UNIT_ID }}" >> local.properties
          echo "prop4=${{ env.ADMOB_DEBUG_TEST_DEVICE_ID }}" >> local.properties
          echo "prop5=${{ env.STORE_PASSWORD }}" >> local.properties
          echo "prop6=${{ env.KEY_PASSWORD }}" >> local.properties
          echo "prop7=${{ env.KEY_ALIAS }}" >> local.properties
          echo "prop8=${{ env.STORE_FILE_NAME }}" >> local.properties          

      - name: Gradle assemble
        uses: gradle/gradle-build-action@v2
      - name: Build app
        run: ./gradlew assemble