name: Android Debug Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

env:
  ADMOB_DEBUG_UNIT_ID: ${{ secrets.ADMOB_DEBUG_UNIT_ID }}
  ADMOB_DEBUG_TEST_DEVICE_ID: ${{ secrets.ADMOB_DEBUG_TEST_DEVICE_ID }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "prop1=${{ env.ADMOB_DEBUG_UNIT_ID }}" >> local.properties
          echo "prop2=${{ env.ADMOB_DEBUG_TEST_DEVICE_ID }}" >> local.properties        

      - name: Gradle Debug Assemble
        uses: gradle/gradle-build-action@v2
      - name: Build Debug app
        run: ./gradlew assembleDebug