name: Android Release Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BODY }}" | base64 --decode > release.keystore

      - name: Create local.properties
        run: |
          echo "admobAppId=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          echo "admobUnitId=${{ secrets.ADMOB_UNIT_ID }}" >> local.properties
          echo "admobTestDeviceId=${{ secrets.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storeFileName=${{ secrets.STORE_FILE_NAME }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Test report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: always()

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7