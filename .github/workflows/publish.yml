name: Android APK Deploy

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

env:
  ADMOB_UNIT_ID: ${{ secrets.ADMOB_UNIT_ID }}
  ADMOB_TEST_DEVICE_ID: ${{ secrets.ADMOB_TEST_DEVICE_ID }}
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  STORE_FILE_NAME: ${{ secrets.STORE_FILE_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "prop1=${{ env.ADMOB_UNIT_ID }}" > local.properties
          echo "prop2=${{ env.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "prop3=${{ env.STORE_PASSWORD }}" >> local.properties
          echo "prop4=${{ env.KEY_PASSWORD }}" >> local.properties
          echo "prop5=${{ env.KEY_ALIAS }}" >> local.properties
          echo "prop6=${{ env.STORE_FILE_NAME }}" >> local.properties          

      - name: Gradle Release Assemble
        uses: gradle/gradle-build-action@v2
      - name: Build Release app
        run: ./gradlew assembleRelease

      - name: Deploy to Google Play Store
        uses: actions/google-play-deploy@v1
        with:
          service-account-key: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          apk-files: app/build/outputs/apk/release/*.apk
          track: production