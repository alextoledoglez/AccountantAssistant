        #releaseDirectory: app/build/outputs/bundle/release
        #signingKeyBase64: ${{ secrets.SIGN_KEY }}
        #alias: ${{ secrets.ALIAS }}
        #keyStorePassword: ${{ secrets.STORE_KEY_PASSWORD }}
        #keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Get release notes from tags
        run: |
          NOTES=$(git tag -l --format='%(contents)' $(git describe --tags --abbrev=0))
          echo "::set-output name=notes::$NOTES"        

      - name: Deploy to Google Play Store
        uses: actions/google-play-deploy
        with:
          release_notes: ${{ steps.get_notes.outputs.notes }}
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          PACKAGE_NAME: com.personal.accountantAssistant

