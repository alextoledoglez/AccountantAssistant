name: Android Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (for example, v1.2.0)"
        required: true
        type: string
      notes:
        description: "Release notes"
        required: true
        default: "<en-US></en-US><es-ES></es-ES><pt-BR></pt-BR>"
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Create trusted publish configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BODY: ${{ secrets.RELEASE_KEYSTORE_BODY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_UNIT_ID: ${{ secrets.ADMOB_UNIT_ID }}
          ADMOB_TEST_DEVICE_ID: ${{ secrets.ADMOB_TEST_DEVICE_ID }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_FILE_NAME: ${{ secrets.STORE_FILE_NAME }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$RELEASE_KEYSTORE_BODY" | base64 --decode > release.keystore
          {
            printf 'admobAppId=%s\n' "$ADMOB_APP_ID"
            printf 'admobUnitId=%s\n' "$ADMOB_UNIT_ID"
            printf 'admobTestDeviceId=%s\n' "$ADMOB_TEST_DEVICE_ID"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFileName=%s\n' "$STORE_FILE_NAME"
          } > local.properties

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release AAB
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Deploy to Google Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          packageName: com.personal.accountantAssistant
          tracks: internal
          status: draft
          changesNotSentForReview: true
          releaseName: ${{ inputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body: ${{ inputs.notes }}
          files: app/build/outputs/bundle/release/app-release.aab

      - name: Remove temporary credentials
        if: always()
        run: rm -f app/google-services.json release.keystore local.properties
