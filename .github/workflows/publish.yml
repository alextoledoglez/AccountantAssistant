name: Android Publish Build

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout

      - name: Get current version
        id: get_version
        uses: actions/increment-version
        with:
          version: v1.1.1

      - name: Create Release Tag
        uses: actions/create-tag
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        with:
          ref: refs/heads/production
          tag: ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
          message: Release ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}

      - name: Set up JDK 11
        uses: actions/setup-java
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Generate release keystore
        run: |
          keytool -genkeypair -alias ${{ secrets.KEY_ALIAS }} -keyalg RSA -keysize 2048 -validity 10000 -keystore ${{ secrets.STORE_FILE_NAME }} -storepass ${{ secrets.STORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} -dname "CN=Company Name, OU=Organization Unit, O=Organization, L=Location, S=State, C=Country Code"

      - name: Create local.properties
        run: |
          echo "admobUnitId=${{ secrets.ADMOB_UNIT_ID }}" > local.properties
          echo "admobTestDeviceId=${{ secrets.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storeFileName=${{ secrets.STORE_FILE_NAME }}" >> local.properties       

      - name: Gradle Release Assemble
        uses: gradle/gradle-build-action
      - name: Build Release app
        run: ./gradlew assembleRelease

      - name: Unit Test
        run: ./gradlew testReleaseUnitTest

      - name: Test Report
        uses: asadmansr/android-test-report-action
        if: ${{ always() }}

        #- name: Build Release AAB
        #run: ./gradlew bundleRelease

        #- name: Upload APK
