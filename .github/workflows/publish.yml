name: Android Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Input version tag (ex: v#.#.#):'
        required: true
      notes:
        description: 'Input release notes:'
        required: true
        default: '<en-US></en-US><es-ES></es-ES><pt-BR></pt-BR>'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BODY }}" | base64 --decode > release.keystore

      - name: Create local.properties
        run: |
          echo "admobAppId=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          echo "admobUnitId=${{ secrets.ADMOB_UNIT_ID }}" >> local.properties
          echo "admobTestDeviceId=${{ secrets.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storeFileName=${{ secrets.STORE_FILE_NAME }}" >> local.properties

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Test report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: always()

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Deploy to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          packageName: com.personal.accountantAssistant
          tracks: internal
          status: draft
          changesNotSentForReview: true
          releaseName: ${{ github.event.inputs.tag }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.tag }}
          body: ${{ github.event.inputs.notes }}
          files: app/build/outputs/bundle/release/app-release.aab