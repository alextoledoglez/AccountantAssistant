name: Android Publish Build

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate release keystore
        run: echo ${{ secrets.RELEASE_KEYSTORE_BODY }} | base64 --decode > release.keystore

      - name: Create local.properties
        run: |
          echo "admobUnitId=${{ secrets.ADMOB_UNIT_ID }}" > local.properties
          echo "admobTestDeviceId=${{ secrets.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storeFileName=${{ secrets.STORE_FILE_NAME }}" >> local.properties       

      - name: Unit Test
        run: ./gradlew testReleaseUnitTest

      - name: Test Report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }}

      - name: Build AAB bundle
        run: ./gradlew bundleRelease

      - name: Sign AAB bundle
        run: |
          jarsigner -keystore ${{ secrets.STORE_FILE_NAME }} \
          -storepass ${{ secrets.STORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} \
          app/build/outputs/bundle/release/app-release.aab ${{ secrets.KEY_ALIAS }}          

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          packageName: com.personal.accountantAssistant
          status: draft

      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Changes in this Release
            - First Change
            - Second Change
          draft: false
          prerelease: false