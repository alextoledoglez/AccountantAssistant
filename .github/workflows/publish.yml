name: Android Publish Build

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

env:
  ANDROID_COMPILE_SDK: "30"
  ANDROID_BUILD_TOOLS: "30.0.3"
  ANDROID_SDK_TOOLS: "6758059"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Generate release keystore
        run: |
          keytool -genkeypair -alias ${{ secrets.KEY_ALIAS }} -keyalg RSA -keysize 2048 -validity 10000 -keystore ${{ secrets.STORE_FILE_NAME }} -storepass ${{ secrets.STORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} -dname "CN=Company Name, OU=Organization Unit, O=Organization, L=Location, S=State, C=Country Code"

      - name: Create local.properties
        run: |
          echo "admobUnitId=${{ secrets.ADMOB_UNIT_ID }}" > local.properties
          echo "admobTestDeviceId=${{ secrets.ADMOB_TEST_DEVICE_ID }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storeFileName=${{ secrets.STORE_FILE_NAME }}" >> local.properties       

      - name: Gradle Release Assemble
        uses: gradle/gradle-build-action@v2
      - name: Build Release app
        run: ./gradlew assembleRelease

      - name: Unit Test
        run: ./gradlew testReleaseUnitTest

      - name: Test Report
        uses: asadmansr/android-test-report-action@v1.2.0
        if: ${{ always() }}

        #- name: Build Release AAB
        #run: ./gradlew bundleRelease

        #- name: Upload APK
        #uses: actions/upload-artifact@v2
        #with:
        #name: app-release.apk
        #path: app/build/outputs/apk/release/app-release.apk

        #- name: Sign AAB
        #uses: r0adkll/sign-android-release@v1
        #with:
        #releaseDirectory: app/build/outputs/bundle/release
        #signingKeyBase64: ${{ secrets.SIGN_KEY }}
        #alias: ${{ secrets.ALIAS }}
        #keyStorePassword: ${{ secrets.STORE_KEY_PASSWORD }}
        #keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          releaseFiles: app/build/outputs/apk/release/app-release.apk
          packageName: com.personal.accountantAssistant
          track: alpha

          #- name: Sign and Align APK
          #run: |
          #jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          #-keystore release.keystore \
          #-storepass ${{ secrets.STORE_PASSWORD }} \
          #-keypass ${{ secrets.KEY_PASSWORD }} \
          #app/build/outputs/apk/release/app-release.apk \
          #${{ secrets.KEY_ALIAS }}

          #${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/zipalign \
          #-v 4 app/build/outputs/apk/release/app-release.apk \
          #app/build/outputs/apk/release/app-release-aligned.apk

          #- name: Upload to Google Play Store
          #uses: actions/upload-to-google-play@v1
          #with:
          #key-file: release.keystore
          #key-password: ${{ secrets.STORE_PASSWORD }}
          #key-alias: ${{ secrets.KEY_ALIAS }}
          #apk-file: app/build/outputs/apk/release/app-release-aligned.apk
          #package-name: com.personal.accountantAssistant
          #track: alpha

      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Changes in this Release
            - First Change
            - Second Change
          draft: false
          prerelease: false