name: Bug report
description: Report a reproducible problem without including sensitive data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Accountant Assistant. Do not include credentials or real financial data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use synthetic data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove names, emails, tokens, barcodes, account details, and financial data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and personal or financial data from this report.
          required: true
